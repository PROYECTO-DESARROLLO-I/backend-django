services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    image: saludagendax-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      ENV_FILE: .env.production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  celery-worker:
    build: .
    image: saludagendax-backend:latest
    command: celery -A config worker -l info
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      ENV_FILE: .env.production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    image: saludagendax-backend:latest
    command: celery -A config beat -l info
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      ENV_FILE: .env.production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
